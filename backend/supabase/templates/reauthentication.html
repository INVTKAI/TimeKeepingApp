<!DOCTYPE html>
<html>
  <body style="margin:0;padding:24px;background:#F8FAFC;font-family:Inter,system-ui,-apple-system,sans-serif;color:#1E293B">
    <span style="display:none;max-height:0;overflow:hidden">Your Invenio Timekeeping verification code.</span>
    <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width:560px;margin:0 auto;background:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px">
      <tr>
        <td style="padding:32px">
          <h1 style="font-size:20px;margin:0 0 16px 0;color:#1E293B">Your verification code</h1>
          <p style="font-size:14px;line-height:1.5;margin:0 0 16px 0">Enter this code to confirm a sensitive action on your Invenio Timekeeping account:</p>
          <p style="margin:24px 0;text-align:center">
            <span style="display:inline-block;background:#F1F5F9;color:#1E293B;padding:16px 32px;border-radius:8px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:28px;letter-spacing:8px;font-weight:600">{{ .Token }}</span>
          </p>
          <p style="font-size:13px;line-height:1.5;margin:0;color:#64748B">Valid for 1 hour. If you didn't request this, ignore this email &mdash; no action is taken without the code.</p>
        </td>
      </tr>
    </table>
    <p style="max-width:560px;margin:12px auto 0;font-size:12px;color:#94A3B8;text-align:center">Sent by Invenio Timekeeping</p>
  </body>
</html>
