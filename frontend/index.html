<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/brand/app-icon.svg" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <meta name="theme-color" content="#0369A1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1220" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Invenio Timekeeping" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Invenio Timekeeping</title>
    <script>
      // Apply theme before first paint to avoid a light-mode flash on dark
      // devices. Keep in sync with STORAGE_KEY in src/context/ThemeContext.tsx.
      (function () {
        try {
          var pref = localStorage.getItem("invenio.theme") || "system";
          var dark =
            pref === "dark" ||
            (pref === "system" &&
              window.matchMedia &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            dark ? "dark" : "light",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
